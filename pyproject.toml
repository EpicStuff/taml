[build-system]
	build-backend = "setuptools.build_meta"
	requires = ["setuptools>=61.0"]
[project]
	authors = [{email = "EpicStuff@users.noreply.github.com", name = "EpicStuff"}]
	classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3"]
	dependencies = ["beartype", "epicstuff~=3.0.0", "ruamel.yaml~=0.19.0", "zope.dottedname"]
	description = "YAML but with tabs"
	name = "taml"
	readme = "README.md"
	requires-python = ">=3.13"
	version = "2.1.0"

	[project.urls]
		Homepage = "https://github.com/EpicStuff/taml"
		Issues = "https://github.com/EpicStuff/taml/issues"
